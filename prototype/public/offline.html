<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#060E16" />
<title>Offline — Project Maps</title>
<style>
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #060E16;
    color: #DCE3EB;
    font-family: "Montserrat", system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    background: #1A2127;
    border: 1px solid #2F3A41;
    border-radius: 16px;
    padding: 32px 24px;
  }
  .eyebrow {
    color: #2AFED7;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0; color: #8A969C; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">No connection</p>
    <h1>You&rsquo;re offline</h1>
    <p>Saved places will still open. New searches and reports will work once you&rsquo;re back online.</p>
  </div>
</body>
</html>
